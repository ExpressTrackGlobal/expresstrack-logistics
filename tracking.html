<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Package - ExpressTrack Logistics</title>
</head>

<body style="font-family:Arial,sans-serif;background:#f4f4f4;margin:0;">

<header style="background:#003366;color:white;padding:20px;text-align:center;">
  <h1>ExpressTrack Logistics</h1>
  <p>Package Tracking Portal</p>
</header>

<nav style="background:#0055a5;padding:15px;text-align:center;">
  <a href="index.html" style="color:white;margin:15px;">Home</a>
  <a href="tracking.html" style="color:white;margin:15px;">Track Package</a>
</nav>

<section style="padding:40px;text-align:center;">
  <h2>Track Your Shipment</h2>

  <p>Enter your tracking number below:</p>

  <input type="text" placeholder="Example: ETL100001"
  style="padding:12px;width:300px;max-width:90%;">

  <br><br>

  <button style="padding:12px 30px;background:#003366;color:white;border:none;border-radius:5px;">
    Track
  </button>

  <div style="margin-top:30px;background:white;padding:20px;display:inline-block;">
    <h3>Shipment Status</h3>
    <p>Your tracking information will appear here.</p>
  </div>

</section>

<footer style="background:#003366;color:white;text-align:center;padding:20px;">
  © 2026 ExpressTrack Logistics
</footer>
